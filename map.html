<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS Picks - Research Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map-container {
            width: 100%;
            height: 75vh;
            min-height: 400px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .map-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .map-controls select,
        .map-controls button {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .map-controls select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .map-controls label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .map-legend {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .legend-gradient {
            width: 120px;
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(to right, #22c55e, #eab308, #ef4444);
        }

        .map-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .map-stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            min-width: 120px;
        }

        .map-stat-card .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .map-stat-card .stat-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .leaflet-popup-content {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .popup-school-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .popup-rank {
            color: #3b82f6;
            font-weight: 600;
        }

        .popup-faculty-list {
            margin-top: 6px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .popup-faculty-item {
            padding: 2px 0;
            border-bottom: 1px solid #eee;
        }

        [data-theme="dark"] .leaflet-popup-content-wrapper {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        [data-theme="dark"] .leaflet-popup-tip {
            background: var(--card-bg);
        }

        [data-theme="dark"] .popup-faculty-item {
            border-bottom-color: #333;
        }

        [data-theme="dark"] .leaflet-control-zoom a {
            background: var(--card-bg);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        [data-theme="dark"] .leaflet-control-attribution {
            background: rgba(30, 30, 30, 0.8);
            color: #888;
        }

        [data-theme="dark"] .leaflet-control-attribution a {
            color: #aaa;
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="sun-icon">☀️</span>
        <span class="moon-icon">🌙</span>
    </button>
    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = savedTheme || (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', initialTheme);
    </script>
    <div id="app">
        <header>
            <h1>CS Picks</h1>
            <div class="top-nav" style="display: flex; gap: 1rem; margin-bottom: 1rem; justify-content: center;">
                <a href="index.html"
                    style="text-decoration: none; color: var(--text-secondary); font-weight: 600;">Search</a>
                <a href="analysis.html"
                    style="text-decoration: none; color: var(--text-secondary); font-weight: 600;">Analysis</a>
                <a href="compare.html"
                    style="text-decoration: none; color: var(--text-secondary); font-weight: 600;">Compare</a>
                <a href="map.html"
                    style="text-decoration: none; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); font-weight: 600;">Map</a>
            </div>
            <p>Research, visualized.</p>
        </header>

        <main style="max-width: 1200px; margin: 0 auto; padding: 0 1rem;">
            <div class="map-controls">
                <div>
                    <label for="map-area-select">Area</label>
                    <select id="map-area-select">
                        <option value="overall">Overall</option>
                    </select>
                </div>
                <div>
                    <label for="map-region-select">Region</label>
                    <select id="map-region-select">
                        <option value="world">World</option>
                        <option value="us" selected>US</option>
                        <option value="northamerica">North America</option>
                        <option value="europe">Europe</option>
                        <option value="asia">Asia</option>
                        <option value="australasia">Australasia</option>
                    </select>
                </div>
                <div class="map-legend">
                    <span>Top</span>
                    <div class="legend-gradient"></div>
                    <span>Lower</span>
                </div>
            </div>

            <div class="map-stats" id="map-stats">
                <div class="map-stat-card">
                    <div class="stat-value" id="stat-schools">-</div>
                    <div class="stat-label">Schools on map</div>
                </div>
                <div class="map-stat-card">
                    <div class="stat-value" id="stat-faculty">-</div>
                    <div class="stat-label">Faculty</div>
                </div>
                <div class="map-stat-card">
                    <div class="stat-value" id="stat-top">-</div>
                    <div class="stat-label">#1 School</div>
                </div>
            </div>

            <div id="map-container"></div>
            <p id="map-missing-note" style="font-size: 0.78rem; color: var(--text-secondary); text-align: center;"></p>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/map.js"></script>
</body>

</html>
