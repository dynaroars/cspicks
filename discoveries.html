<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    const applySystemTheme = () => document.documentElement.setAttribute('data-theme', systemTheme.matches ? 'dark' : 'light');
    applySystemTheme();
    systemTheme.addEventListener('change', applySystemTheme);
  </script>
  <title>CS Picks - Discoveries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="app">
    <header>
      <div class="title-row">
        <h1>CS Picks</h1>
        <a class="github-link" href="https://github.com/dynaroars/cspicks" target="_blank" rel="noopener noreferrer" aria-label="View CS Picks on GitHub" title="View source on GitHub"></a>
      </div>
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="index.html">Search</a>
        <a href="analysis.html">Analysis</a>
        <a href="compare.html">Compare</a>
        <a href="simulator.html">Simulator</a>
        <a href="discoveries.html" class="active" aria-current="page">🔭 Discoveries</a>
      </nav>
      <p>Find surprising changes and hidden patterns across Computer Science departments.</p>
    </header>

    <main class="discoveries-page">
      <div class="filters search-filters discoveries-filters" aria-label="Discovery filters">
        <div class="filter-group search-region-control">
          <select id="discoveries-region" aria-label="Region">
            <option value="world">World</option>
            <option value="us" selected>USA</option>
            <option value="europe">Europe</option>
            <option value="asia">Asia</option>
            <option value="canada">Canada</option>
            <option value="australasia">Australasia</option>
          </select>
        </div>
        <div class="filter-group" aria-label="Year range">
          <div class="year-inputs">
            <select id="discoveries-start-year" aria-label="Start year"></select>
            <span>to</span>
            <select id="discoveries-end-year" aria-label="End year"></select>
          </div>
        </div>
        <div class="filter-group conference-set-control">
          <select id="discoveries-conf-set" aria-label="Conference set">
            <option value="csrankings-default" selected>CSRankings (Default)</option>
            <option value="csrankings">CSRankings (All)</option>
            <option value="core">CORE A*</option>
            <option value="core-a">CORE A*/A</option>
          </select>
          <span class="tooltip-trigger filter-info" tabindex="0" aria-label="About conference sets">ⓘ
            <span class="tooltip-content">Chooses which publication venues contribute to every discovery.</span>
          </span>
        </div>
        <div class="filter-group checkboxes">
          <label for="discoveries-history" class="filter-checkbox">
            <input type="checkbox" id="discoveries-history">
            <span>Use History</span>
            <span class="tooltip-trigger" tabindex="0" aria-label="About historical mode">ⓘ
              <span class="tooltip-content">Credits each publication to the author's institution in its publication year when historical data is available.</span>
            </span>
          </label>
        </div>
      </div>

      <div id="discoveries-loading" class="simulator-loading">Finding notable patterns…</div>
      <div id="discovery-stats" class="diagnostic-panel hidden" aria-live="polite"></div>
    </main>
  </div>

  <footer>
    <a href="faq.html" style="color: inherit; text-decoration: underline;">FAQ, Methods &amp; Data</a>
  </footer>
  <script type="module" src="./src/discoveries.js"></script>
</body>

</html>
