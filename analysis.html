<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Picks</title>
  <script>
    const old = new URLSearchParams(window.location.search);
    const next = new URL('index.html', window.location.href);
    const target = old.get('target');
    if (target) next.searchParams.set('q', target);
    ['start', 'end', 'region', 'historical', 'confSet'].forEach(key => {
      if (old.has(key)) next.searchParams.set(key, old.get(key));
    });
    window.location.replace(next);
  </script>
</head>
<body>
  <p>Analysis is now part of <a href="index.html">Search</a>.</p>
</body>
</html>
