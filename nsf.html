  <meta name="description" content="Search NSF-funded CS faculty and departments nationwide. Explore award trends, funding growth, and department-level NSF funding portfolios built from official NSF Award Search data.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CS Picks">
  <meta property="og:title" content="CS Picks - NSF Funding Explorer">
  <meta property="og:description" content="Search NSF-funded CS faculty and departments nationwide. Explore award trends, funding growth, and department-level NSF funding portfolios built from official NSF Award Search data.">

  <meta property="og:image" content="https://cspicks.roars.dev/og-image.png">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CS Picks - NSF Funding Explorer">
  <meta name="twitter:description" content="Search NSF-funded CS faculty and departments nationwide, built from official NSF Award Search data.">

       sign up at plausible.io (or self-host), then uncomment and set data-domain.

</head>
<body class="search-page funding-page">
  <div id="app">
    <header>
      <div class="title-row">
        <a class="site-title-link" href="index.html" aria-label="Reset CS Picks"><h1>CS Picks</h1></a>
        <a class="github-link" href="https://github.com/dynaroars/cspicks" target="_blank" rel="noopener noreferrer" aria-label="View CS Picks on GitHub" title="View source on GitHub"></a>
        <a class="icon-link" href="https://github.com/dynaroars/cspicks/blob/main/README.md" target="_blank" rel="noopener noreferrer" aria-label="FAQ, methods and data" title="FAQ, methods &amp; data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 2-2.8 2.4-2.8 4.2"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/></svg></a>
        <a class="icon-link" id="nsf-data-health-toggle" href="?dataHealth=true#nsf-data-health" aria-label="Data health" title="Data health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg></a>
        <a class="icon-link roars-link" href="https://roars.dev" target="_blank" rel="noopener noreferrer" aria-label="ROARS Lab" title="ROARS Lab"></a>
      </div>
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="index.html">🔎 Search</a>
        <a href="index.html?view=discoveries">🔭 Discoveries</a>
        <a href="simulator.html">☠️ Simulator</a>
        <a href="csconfs.html">📅 CS Confs</a>
        <a href="grants.html">💰 Awards &amp; Grants</a>
        <a href="nsf.html" class="active" aria-current="page">🇺🇸 NSF Funding</a>
      </nav>
    </header>

    <section class="search-section funding-search-section">
      <div class="search-intro">
        <h2>Explore NSF funding</h2>
        <p>Search matched CS faculty, universities, awards, and NSF programs.</p>
      </div>
      <div class="search-container">
        <div class="universal-search">
          <input type="search" id="funding-search" placeholder="Loading NSF award data…" disabled autofocus
            autocomplete="off" aria-autocomplete="list" aria-controls="universal-suggestions"
            aria-expanded="false">
          <div id="universal-suggestions" class="universal-suggestions" role="listbox" hidden></div>
        </div>
      </div>
      <div class="search-examples">
        <span>Examples:</span>
        <span id="funding-examples" class="search-examples-row"></span>
      </div>
      <div id="filter-bar"></div>
    </section>

    <section id="funding-comparison" class="comparison-results" hidden aria-live="polite">
      <div class="comparison-results-header">
        <h2 id="funding-comparison-title">Head-to-head</h2>
        <p>NSF awards for the selected year range, attributed to matched CS faculty.</p>
      </div>
      <div id="funding-comparison-summary" class="comparison-summary"></div>
    </section>

    <main class="funding-results-container">
      <div id="funding-status" class="funding-status" role="status" aria-live="polite"></div>
      <section id="funding-school-results" class="results-grid"></section>
      <section id="funding-faculty-results" class="results-grid"></section>
    </main>

    <section id="nsf-data-health" class="site-data-health" hidden aria-label="NSF funding data health">
      <button type="button" id="nsf-data-health-close" class="data-health-close" aria-label="Close data health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div id="nsf-data-health-stats" class="diagnostic-panel"></div>
    </section>
  </div>
  <script type="module" src="/src/funding.js"></script>
</body>
</html>
